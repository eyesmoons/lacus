# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8090
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# Spring配置 如果需要无Mysql  无Redis直接启动的话  dev改为test
spring:
  profiles:
    active: basic, dev

# 如果需要无Mysql  无Redis直接启动的话  可以将这两个参数置为true, 并且spring.profile.active: dev换成test
lacus:
  embedded:
    mysql: false
    redis: false

ml:
  service:
    url: http://localhost:8000
    timeout:
      connect: 5000
      read: 120000

storage:
  root: /Users/casey/Downloads/20260930/lake-intelligence
  max-dataset-size: 50000
  max-upload-size: 500
  max-image-size: 10

app:
  crypto:
    key: ${CRYPTO_KEY:change-me-in-production}

training:
  max-concurrent: 1
  timeout-hours: 2
  poll-interval-ms: 2000

vector:
  build-timeout-hours: 1
  batch-size: 5000
