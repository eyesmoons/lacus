<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{lakeintelligence/layout::layout('湖智 - 向量构建', ~{::content})}"
      lang="zh-CN">
<body>
    <th:block th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="mb-1">向量库构建</h4>
                <p class="text-muted mb-0">将图片库中的图像编码为向量索引，用于相似度检索</p>
            </div>
            <a href="/lake-intelligence/training/new" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>返回
            </a>
        </div>

        <!-- 构建配置 -->
        <div class="card lake-card mb-4" id="configCard">
            <div class="card-header">
                <i class="bi bi-gear me-2"></i>构建配置
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="indexName" class="form-label">向量库名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="indexName" placeholder="例如：product_vectors">
                    </div>
                    <div class="col-md-6">
                        <label for="datasetSelect" class="form-label">选择图片库 <span class="text-danger">*</span></label>
                        <select class="form-select" id="datasetSelect" name="datasetId">
                            <option value="">请选择数据集...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="modelSelect" class="form-label">选择模型 <span class="text-danger">*</span></label>
                        <select class="form-select" id="modelSelect" name="modelId">
                            <option value="">请选择训练完成的模型...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="collectionName" class="form-label">集合名称</label>
                        <input type="text" class="form-control" id="collectionName" value="image_collection">
                    </div>
                    <div class="col-md-6">
                        <label for="distanceMetric" class="form-label">距离度量</label>
                        <select class="form-select" id="distanceMetric">
                            <option value="cosine" selected>余弦相似度 (Cosine)</option>
                            <option value="euclidean">欧氏距离 (Euclidean)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="batchSize" class="form-label">批次大小</label>
                        <input type="number" class="form-control" id="batchSize" value="32" min="1" max="256">
                    </div>
                </div>
                <hr>
                <div class="d-flex justify-content-end">
                    <button type="button" class="btn btn-primary" id="buildBtn" onclick="startBuild()">
                        <i class="bi bi-hdd me-1"></i>开始构建
                    </button>
                </div>
            </div>
        </div>

        <!-- 构建进度 -->
        <div class="card lake-card mb-4 d-none" id="progressCard">
            <div class="card-header">
                <i class="bi bi-activity me-2"></i>构建进度
            </div>
            <div class="card-body">
                <div class="d-flex justify-content-between mb-2">
                    <span class="fw-medium" id="buildStatus">构建中...</span>
                    <span class="text-muted" id="progressText">0 / 0</span>
                </div>
                <div class="progress" style="height: 24px;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated"
                         id="progressBar" role="progressbar" style="width: 0%">0%</div>
                </div>
                <div class="text-muted small mt-2" id="buildMessage"></div>
            </div>
        </div>

        <!-- 构建完成 -->
        <div id="completedActions" class="d-none">
            <div class="card lake-card border-success">
                <div class="card-body d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="mb-1 text-success"><i class="bi bi-check-circle me-2"></i>向量库构建完成</h6>
                        <small class="text-muted" id="completeMessage">共索引 0 张图片</small>
                    </div>
                    <a href="/lake-intelligence/search" class="btn btn-success">
                        <i class="bi bi-search me-1"></i>开始检索
                    </a>
                </div>
            </div>
        </div>
    </th:block>

    <script th:src="@{/js/lakeintelligence/vector-build.js}"></script>
</body>
</html>
