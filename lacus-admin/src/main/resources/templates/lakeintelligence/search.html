<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{lakeintelligence/layout::layout('湖智 - 相似检索', ~{::content})}"
      lang="zh-CN">
<body>
    <th:block th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="mb-1">相似检索</h4>
                <p class="text-muted mb-0">上传图片，从向量库中检索最相似的图片</p>
            </div>
            <a href="/lake-intelligence/vector-build" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>返回构建
            </a>
        </div>

        <div class="row g-4">
            <!-- 左侧：上传区 -->
            <div class="col-md-4">
                <div class="card lake-card">
                    <div class="card-header">
                        <i class="bi bi-image me-2"></i>查询图片
                    </div>
                    <div class="card-body">
                        <div class="upload-zone mb-3" id="uploadZone"
                             onclick="document.getElementById('imageInput').click()"
                             style="min-height: 200px;">
                            <i class="bi bi-cloud-arrow-up d-block mb-2"></i>
                            <p class="mb-1 fw-medium">点击上传图片</p>
                            <p class="text-muted small mb-0">支持 JPG/PNG/BMP</p>
                            <input type="file" id="imageInput" accept="image/jpeg,image/png,image/bmp" style="display:none">
                        </div>
                        <div id="previewContainer" class="text-center mb-3 d-none">
                            <img id="previewImage" src="" alt="预览" class="img-fluid rounded" style="max-height: 200px;">
                        </div>
                        <div class="mb-3">
                            <label for="topK" class="form-label d-flex justify-content-between">
                                <span>返回数量 (Top-K)</span>
                                <span class="badge bg-primary" id="topKValue">5</span>
                            </label>
                            <input type="range" class="form-range" id="topK" min="1" max="20" value="5">
                        </div>
                        <div class="mb-3">
                            <label for="vectorSelect" class="form-label">选择向量库</label>
                            <select class="form-select" id="vectorSelect">
                                <option value="">默认向量库</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-primary w-100" id="searchBtn" onclick="performSearch()" disabled>
                            <i class="bi bi-search me-1"></i>开始检索
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧：结果区 -->
            <div class="col-md-8">
                <div class="card lake-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-grid-3x3-gap me-2"></i>检索结果</span>
                        <small class="text-muted" id="resultCount">共 0 个结果</small>
                    </div>
                    <div class="card-body">
                        <!-- 空状态 -->
                        <div id="emptyState" class="text-center py-5 text-muted">
                            <i class="bi bi-search fs-1 d-block mb-2"></i>
                            <p>上传图片开始检索</p>
                        </div>

                        <!-- 加载状态 -->
                        <div id="searchLoading" class="text-center py-5 d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">检索中...</span>
                            </div>
                            <p class="text-muted mt-2">正在检索相似图片...</p>
                        </div>

                        <!-- 结果网格 -->
                        <div id="resultGrid" class="row g-3 d-none">
                            <!-- 结果由 JS 动态填充 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <script th:src="@{/js/lakeintelligence/search.js}"></script>
</body>
</html>
