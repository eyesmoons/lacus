<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{lakeintelligence/layout::layout('湖智 - 训练配置', ~{::content})}"
      lang="zh-CN">
<body>
    <th:block th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="mb-1">新建训练任务</h4>
                <p class="text-muted mb-0">配置训练参数，启动自编码器模型训练</p>
            </div>
            <a href="/lake-intelligence/dataset/upload" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>返回
            </a>
        </div>

        <form id="trainForm" class="needs-validation" novalidate>
            <!-- 任务基本信息 -->
            <div class="card lake-card mb-4">
                <div class="card-header">
                    <i class="bi bi-cpu me-2"></i>任务信息
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="taskName" class="form-label">任务名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="taskName" name="taskName"
                                   placeholder="例如：产品图片相似度训练" required>
                            <div class="invalid-feedback">请输入任务名称</div>
                        </div>
                        <div class="col-md-6">
                            <label for="datasetSelect" class="form-label">选择图片库 <span class="text-danger">*</span></label>
                            <select class="form-select" id="datasetSelect" name="datasetId" required>
                                <option value="">请选择数据集...</option>
                            </select>
                            <div class="invalid-feedback">请选择训练数据集</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">任务类型</label>
                            <select class="form-select" id="taskType" name="taskType">
                                <option value="IMAGE_SIMILARITY" selected>图像相似度 (IMAGE_SIMILARITY)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">训练器类型</label>
                            <input type="text" class="form-control" value="similarity" readonly id="trainerType" name="trainerType">
                            <div class="form-text">当前仅支持相似度训练器</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 训练参数 -->
            <div class="card lake-card mb-4">
                <div class="card-header">
                    <i class="bi bi-sliders me-2"></i>训练参数
                </div>
                <div class="card-body">
                    <!-- 训练轮数 -->
                    <div class="row mb-4">
                        <div class="col-12">
                            <label for="epochsRange" class="form-label d-flex justify-content-between">
                                <span>训练轮数 (Epochs)</span>
                                <span class="badge bg-primary" id="epochsValue">30</span>
                            </label>
                            <input type="range" class="form-range" id="epochsRange" name="epochs"
                                   min="5" max="200" value="30" step="1">
                            <div class="form-text d-flex justify-content-between">
                                <span>5</span>
                                <span class="text-muted">推荐值：30，训练轮数越多效果可能越好但耗时更长</span>
                                <span>200</span>
                            </div>
                        </div>
                    </div>

                    <!-- 学习率 -->
                    <div class="row mb-4">
                        <div class="col-12">
                            <label for="lrRange" class="form-label d-flex justify-content-between">
                                <span>学习率 (Learning Rate)</span>
                                <span class="badge bg-primary" id="lrValue">0.001</span>
                            </label>
                            <input type="range" class="form-range" id="lrRange" name="learningRate"
                                   min="-4" max="-2" value="-3" step="0.1">
                            <div class="form-text d-flex justify-content-between">
                                <span>0.0001</span>
                                <span class="text-muted">推荐值：0.001（10<sup>-3</sup>）</span>
                                <span>0.01</span>
                            </div>
                        </div>
                    </div>

                    <!-- 批次大小 -->
                    <div class="row mb-4">
                        <div class="col-12">
                            <label class="form-label">批次大小 (Batch Size)</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="batchSize" id="batch16" value="16">
                                <label class="btn btn-outline-primary" for="batch16">16</label>

                                <input type="radio" class="btn-check" name="batchSize" id="batch32" value="32" checked>
                                <label class="btn btn-outline-primary" for="batch32">32</label>

                                <input type="radio" class="btn-check" name="batchSize" id="batch64" value="64">
                                <label class="btn btn-outline-primary" for="batch64">64</label>
                            </div>
                            <div class="form-text">批次大小影响训练速度和显存占用，推荐值：32</div>
                        </div>
                    </div>

                    <!-- 计算设备 -->
                    <div class="row">
                        <div class="col-12">
                            <label class="form-label">计算设备</label>
                            <select class="form-select" id="deviceSelect" name="device">
                                <option value="cpu" selected>CPU</option>
                                <option value="cuda">CUDA (GPU)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 参数预览 -->
            <div class="card lake-card mb-4 bg-light">
                <div class="card-body">
                    <h6 class="mb-3"><i class="bi bi-clipboard-data me-2"></i>参数预览</h6>
                    <div class="row g-2 small">
                        <div class="col-md-3 col-6">
                            <span class="text-muted">轮数：</span>
                            <span class="fw-medium" id="previewEpochs">30</span>
                        </div>
                        <div class="col-md-3 col-6">
                            <span class="text-muted">学习率：</span>
                            <span class="fw-medium" id="previewLr">0.001</span>
                        </div>
                        <div class="col-md-3 col-6">
                            <span class="text-muted">批次：</span>
                            <span class="fw-medium" id="previewBatch">32</span>
                        </div>
                        <div class="col-md-3 col-6">
                            <span class="text-muted">设备：</span>
                            <span class="fw-medium" id="previewDevice">CPU</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 提交 -->
            <div class="d-flex gap-2 justify-content-end">
                <button type="button" class="btn btn-outline-secondary" onclick="window.history.back()">
                    <i class="bi bi-x-circle me-1"></i>取消
                </button>
                <button type="submit" class="btn btn-primary btn-lg" id="startBtn">
                    <i class="bi bi-rocket-takeoff me-1"></i>启动训练
                </button>
            </div>
        </form>
    </th:block>

    <script th:src="@{/js/lakeintelligence/training.js}"></script>
</body>
</html>
