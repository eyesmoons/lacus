<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{lakeintelligence/layout::layout('湖智 - 图片库上传', ~{::content})}"
      lang="zh-CN">
<body>
    <th:block th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="mb-1">图片库上传</h4>
                <p class="text-muted mb-0">创建新的图片数据集，支持本地、HDFS、S3/MinIO、HTTP 等多种数据源</p>
            </div>
            <a href="/lake-intelligence/models" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>返回模型管理
            </a>
        </div>

        <form id="datasetForm" class="needs-validation" novalidate>
            <!-- 基本信息 -->
            <div class="card lake-card mb-4">
                <div class="card-header">
                    <i class="bi bi-info-circle me-2"></i>基本信息
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="datasetName" class="form-label">数据集名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="datasetName" name="datasetName"
                                   placeholder="例如：产品图片库" required>
                            <div class="invalid-feedback">请输入数据集名称</div>
                        </div>
                        <div class="col-md-6">
                            <label for="description" class="form-label">描述</label>
                            <input type="text" class="form-control" id="description" name="description"
                                   placeholder="数据集用途说明（可选）">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 数据源类型 -->
            <div class="card lake-card mb-4">
                <div class="card-header">
                    <i class="bi bi-hdd-network me-2"></i>数据源类型
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label d-block">选择数据源 <span class="text-danger">*</span></label>
                            <div class="btn-group" role="group" id="sourceTypeGroup">
                                <input type="radio" class="btn-check" name="storageSource" id="sourceLocal" value="LOCAL" checked>
                                <label class="btn btn-outline-primary" for="sourceLocal">
                                    <i class="bi bi-folder2-open me-1"></i>本地文件
                                </label>

                                <input type="radio" class="btn-check" name="storageSource" id="sourceHdfs" value="HDFS">
                                <label class="btn btn-outline-primary" for="sourceHdfs">
                                    <i class="bi bi-hdd-stack me-1"></i>HDFS
                                </label>

                                <input type="radio" class="btn-check" name="storageSource" id="sourceS3" value="S3">
                                <label class="btn btn-outline-primary" for="sourceS3">
                                    <i class="bi bi-cloud me-1"></i>S3
                                </label>

                                <input type="radio" class="btn-check" name="storageSource" id="sourceMinio" value="MINIO">
                                <label class="btn btn-outline-primary" for="sourceMinio">
                                    <i class="bi bi-server me-1"></i>MinIO
                                </label>

                                <input type="radio" class="btn-check" name="storageSource" id="sourceHttp" value="HTTP">
                                <label class="btn btn-outline-primary" for="sourceHttp">
                                    <i class="bi bi-link-45deg me-1"></i>HTTP
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 数据源配置（动态显示） -->
            <div class="card lake-card mb-4">
                <div class="card-header">
                    <i class="bi bi-gear me-2"></i>数据源配置
                </div>
                <div class="card-body">
                    <!-- LOCAL: 文件上传 -->
                    <div id="fields-LOCAL" class="source-fields active">
                        <div class="lake-section-title">本地文件上传</div>
                        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                            <i class="bi bi-cloud-arrow-up d-block mb-2"></i>
                            <p class="mb-1 fw-medium">点击或拖拽文件到此处上传</p>
                            <p class="text-muted small mb-0">支持 .zip 格式，最大 500MB</p>
                            <input type="file" id="fileInput" name="file" accept=".zip" style="display:none">
                        </div>
                        <div id="fileInfo" class="mt-3 d-none">
                            <div class="d-flex align-items-center p-2 bg-light rounded">
                                <i class="bi bi-file-earmark-zip text-primary fs-4 me-2"></i>
                                <div class="flex-grow-1">
                                    <div class="fw-medium" id="fileName"></div>
                                    <small class="text-muted" id="fileSize"></small>
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-danger" onclick="clearFile()">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- HDFS -->
                    <div id="fields-HDFS" class="source-fields">
                        <div class="lake-section-title">HDFS 配置</div>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">HDFS URI <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="hdfsUri" placeholder="hdfs://namenode:8020/path/to/images">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">用户名</label>
                                <input type="text" class="form-control" id="hdfsUser" placeholder="hdfs">
                            </div>
                        </div>
                    </div>

                    <!-- S3 -->
                    <div id="fields-S3" class="source-fields">
                        <div class="lake-section-title">S3 配置</div>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Bucket URI <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="s3Uri" placeholder="s3://bucket-name/path/to/images">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Access Key</label>
                                <input type="text" class="form-control" id="s3AccessKey" placeholder="AKIAIOSFODNN7EXAMPLE">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Secret Key</label>
                                <input type="password" class="form-control" id="s3SecretKey" placeholder="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Region</label>
                                <input type="text" class="form-control" id="s3Region" placeholder="us-east-1" value="us-east-1">
                            </div>
                        </div>
                    </div>

                    <!-- MinIO -->
                    <div id="fields-MINIO" class="source-fields">
                        <div class="lake-section-title">MinIO 配置</div>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Endpoint <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="minioEndpoint" placeholder="http://minio-server:9000">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Bucket URI <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="minioUri" placeholder="minio://bucket-name/path/to/images">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Access Key</label>
                                <input type="text" class="form-control" id="minioAccessKey" placeholder="minioadmin">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Secret Key</label>
                                <input type="password" class="form-control" id="minioSecretKey" placeholder="minioadmin">
                            </div>
                        </div>
                    </div>

                    <!-- HTTP -->
                    <div id="fields-HTTP" class="source-fields">
                        <div class="lake-section-title">HTTP 下载链接</div>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">下载 URL <span class="text-danger">*</span></label>
                                <input type="url" class="form-control" id="httpUrl" placeholder="https://example.com/dataset.zip">
                                <div class="form-text">支持直接下载 zip 文件的 HTTP/HTTPS 链接</div>
                            </div>
                        </div>
                    </div>

                    <!-- 测试连接结果 -->
                    <div id="probeResult" class="mt-3 d-none"></div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="d-flex gap-2 justify-content-end">
                <button type="button" class="btn btn-outline-secondary" id="testBtn" onclick="testConnection()">
                    <i class="bi bi-wifi me-1"></i>测试连接
                </button>
                <button type="submit" class="btn btn-primary" id="createBtn">
                    <i class="bi bi-plus-circle me-1"></i>创建图片库
                </button>
            </div>
        </form>
    </th:block>

    <script th:src="@{/js/lakeintelligence/dataset-upload.js}"></script>
</body>
</html>
